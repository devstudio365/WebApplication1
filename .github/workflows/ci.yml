name: CI

on:
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore WebApplication1.slnx

      - name: Check formatting
        run: dotnet format WebApplication1.slnx --verify-no-changes

      - name: Build
        run: dotnet build WebApplication1.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test WebApplication1.slnx --no-build --configuration Release

  docker-build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build webapi image
        run: docker build -f webapi/Dockerfile -t webapi:ci .

      - name: Build web image
        run: docker build -f WebApplication1/Dockerfile -t webapp:ci .

      - name: Scan webapi image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: webapi:ci
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Scan web image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: webapp:ci
          severity: CRITICAL,HIGH
          exit-code: '1'