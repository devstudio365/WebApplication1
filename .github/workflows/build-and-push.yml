name: Build and Push Images

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: staging
    env:
      ACR_LOGIN_SERVER: devstudio35-hvejakg9fuhngyct.azurecr.io
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name devstudio35 --resource-group DefaultResourceGroup-NEU

      - name: Run database migrations (staging)
        run: dotnet run --project DbMigrator --configuration Release -- kv-webapp1-avwyklhwnltoi StagingDbConnectionString

      - name: Build webapi image
        run: docker build -f webapi/Dockerfile -t $ACR_LOGIN_SERVER/webapi:${{ github.sha }} .

      - name: Build web image
        run: docker build -f WebApplication1/Dockerfile -t $ACR_LOGIN_SERVER/webapp:${{ github.sha }} .

      - name: Push webapi image
        run: docker push $ACR_LOGIN_SERVER/webapi:${{ github.sha }}

      - name: Push web image
        run: docker push $ACR_LOGIN_SERVER/webapp:${{ github.sha }}

      - name: Deploy web to staging
        run: |
          az webapp config container set \
            --name web-webapplication1-staging \
            --resource-group rg-webapplication1-staging \
            --container-image-name $ACR_LOGIN_SERVER/webapp:${{ github.sha }}

      - name: Health check web (staging)
        run: |
          curl -f --retry 10 --retry-delay 10 --retry-connrefused \
            https://web-webapplication1-staging.azurewebsites.net/

      - name: Deploy webapi to staging
        run: |
          az webapp config container set \
            --name webapi-webapplication1-staging \
            --resource-group rg-webapplication1-staging \
            --container-image-name $ACR_LOGIN_SERVER/webapi:${{ github.sha }}

      - name: Health check webapi (staging)
        run: |
          curl -f --retry 10 --retry-delay 10 --retry-connrefused \
            https://webapi-webapplication1-staging.azurewebsites.net/products
